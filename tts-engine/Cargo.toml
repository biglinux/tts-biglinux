[package]
name = "tts-engine"
version = "4.0.0"
edition = "2024"
rust-version = "1.85"
description = "Native TTS engine for BigLinux — espeak-ng, Piper ONNX, PipeWire audio"
license = "GPL-3.0-or-later"

[lib]
name = "tts_engine"
crate-type = ["cdylib"]  # PyO3 dynamic library

[dependencies]
# Python bindings
pyo3 = { version = "0.25", features = ["extension-module"] }

# Audio playback (PipeWire/ALSA auto-detected)
rodio = { version = "0.20", default-features = false, features = ["wav"] }

# ONNX Runtime for Piper inference (use system library, no auto-download)
ort = { version = "2.0.0-rc.9", default-features = false, features = ["std"] }

# WAV encoding
hound = "3.5"

# Logging
log = "0.4"
pyo3-log = "0.12"

# Serialization (Piper model config)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

[build-dependencies]
pyo3-build-config = "0.25"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Framework-specific allows
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"

[lints.rust]
# Restriction lints
unsafe_code = "warn"

[profile.release]
lto = "thin"
strip = true
opt-level = 3
